<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blood Glucose Tracker - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Blood Glucose Tracker</h1>
        <p>Sign in to manage your readings</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
        </div>

        <div id="login-error" class="error-message hidden"></div>

        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <div class="auth-footer">
        <p>Demo credentials: <strong>admin</strong> / <strong>password123</strong></p>
        <p>Or <a href="#" id="register-link">register a new account</a></p>
      </div>
    </div>

    <!-- Register panel (hidden by default) -->
    <div class="auth-card hidden" id="register-panel">
      <div class="auth-header">
        <h2>Create Account</h2>
        <p>Register to start tracking</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input
            type="text"
            id="reg-username"
            name="reg-username"
            placeholder="Choose a username"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input
            type="password"
            id="reg-password"
            name="reg-password"
            placeholder="Choose a password (min 6 chars)"
            required
          />
        </div>

        <div id="register-error" class="error-message hidden"></div>
        <div id="register-success" class="success-message hidden"></div>

        <button type="submit" class="btn btn-primary btn-full">Register</button>
      </form>

      <div class="auth-footer">
        <p><a href="#" id="login-link">Back to login</a></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
